<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, sans-serif">
<rect width="900" height="420" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Arsitektur Sistem dengan API Gateway</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="40" y="170" width="140" height="80" rx="10" fill="#e5e7eb" stroke="#374151"/>
<text x="110" y="205" text-anchor="middle" font-size="15" font-weight="bold">Client</text>
<text x="110" y="226" text-anchor="middle" font-size="12">Postman / Browser</text>
<rect x="290" y="130" width="200" height="160" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="390" y="165" text-anchor="middle" font-size="16" font-weight="bold">API Gateway</text>
<text x="390" y="187" text-anchor="middle" font-size="12">Node.js + Express</text>
<text x="390" y="212" text-anchor="middle" font-size="13" font-weight="bold">Port 3000</text>
<text x="390" y="238" text-anchor="middle" font-size="12">Rate limiting (429)</text>
<text x="390" y="258" text-anchor="middle" font-size="12">Proxy GraphQL, REST ke gRPC</text>
<rect x="640" y="70" width="220" height="110" rx="10" fill="#dcfce7" stroke="#15803d"/>
<text x="750" y="100" text-anchor="middle" font-size="15" font-weight="bold">Service 1: GraphQL</text>
<text x="750" y="122" text-anchor="middle" font-size="12">music-api (Go), HTTP</text>
<text x="750" y="144" text-anchor="middle" font-size="13" font-weight="bold">Port 8080</text>
<text x="750" y="164" text-anchor="middle" font-size="11">/graphql</text>
<rect x="640" y="240" width="220" height="110" rx="10" fill="#fef9c3" stroke="#a16207"/>
<text x="750" y="270" text-anchor="middle" font-size="15" font-weight="bold">Service 2: gRPC</text>
<text x="750" y="292" text-anchor="middle" font-size="12">music-api (Go), LaguService.GetLagu</text>
<text x="750" y="314" text-anchor="middle" font-size="13" font-weight="bold">Port 50051</text>
<line x1="180" y1="210" x2="288" y2="210" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<line x1="490" y1="180" x2="638" y2="125" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<line x1="490" y1="240" x2="638" y2="295" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="234" y="200" text-anchor="middle" font-size="11">:3000</text>
<text x="520" y="138" font-size="11" fill="#15803d">POST /graphql</text>
<text x="500" y="300" font-size="11" fill="#a16207">GET /grpc/lagu/:id</text>
<text x="450" y="395" text-anchor="middle" font-size="12" fill="#4b5563">Client hanya mengenal satu alamat (localhost:3000); service di belakang gateway tidak diakses langsung.</text>
</svg>
